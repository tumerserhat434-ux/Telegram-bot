<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Döner Ustası</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
  <link rel="preload" as="image" href="static/assets/bg.webp">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="static/three.min.js"></script>
  <link rel="stylesheet" href="static/style.css">
</head>
<body>
  <header class="topbar">
    <div class="player">
      <img class="avatar" src="static/assets/avatar.webp" alt="">
      <div class="lv">
        <span>Lv. <b id="level">1</b></span>
        <div class="xp"><div id="xpFill"></div></div>
      </div>
    </div>
    <div class="stats">
      <button class="stat" data-go="upgrades"><i>💰</i><b id="coins">0</b><em>+</em></button>
      <button class="stat" data-go="game"><i>🥙</i><b id="served">0</b><em>+</em></button>
      <button class="stat" data-go="shop"><i>⭐</i><b id="perkCount">0</b><em>+</em></button>
    </div>
    <div class="icons">
      <button class="round" data-go="rewards" aria-label="Ödüller">🔔<span id="bellDot" class="dot"></span></button>
      <button class="round" id="btnSettings" aria-label="Ayarlar">⚙️</button>
    </div>
  </header>

  <div class="awning"></div>
  <div class="sign"><span class="sign-hat">👨‍🍳</span><span class="sign-text">Döner Ustası</span></div>
  <a id="sponsor" class="sponsor" target="_blank" rel="noopener">📢 Reklamınız burada olabilir</a>

  <main>
    <!-- OYUN -->
    <section id="tab-game" class="tab active">
      <div id="customers" class="customers"></div>

      <div class="kitchen">
        <div class="station">
          <div class="label">Döner</div>
          <div id="spit" class="spit">
            <div class="pole"></div>
            <div id="meat" class="meat"></div>
            <div class="fire"></div>
          </div>
          <button id="btnSlice" class="btn gold big">🔪 Kes</button>
          <div class="tray">Tepsi: <b id="tray">0</b> porsiyon</div>
        </div>

        <div class="station">
          <div class="label">Saç</div>
          <div class="sac-wrap">
            <div id="sac" class="sac"><div id="sacBread" class="bread hidden"></div></div>
            <div id="steam" class="steam">♨️</div>
          </div>
          <div class="heatbar"><div class="ideal"></div><div id="heatFill" class="fill"></div></div>
          <div class="row">
            <button class="btn gold" data-bread="lavas">🫓 Lavaş</button>
            <button class="btn gold" data-bread="ekmek">🥖 Ekmek</button>
          </div>
          <button id="btnTake" class="btn gold">🫳 Saçtan Al</button>
        </div>
      </div>

      <div class="board">
        <div class="label">Tezgah</div>
        <div id="build" class="build empty"></div>
        <div id="check" class="check"></div>
        <div class="row wrap">
          <button class="btn wood" id="btnMeat">🥩 Et Koy</button>
          <button class="btn wood" data-top="tursu">🥒 Turşu</button>
          <button class="btn wood" data-top="mayonez">🧴 Mayonez</button>
          <button class="btn wood" data-top="ketcap">🍅 Ketçap</button>
          <button class="btn wood" data-top="patates">🍟 Patates</button>
        </div>
        <div class="row">
          <button class="btn wood" id="btnWrap">🌯 Sar / Kapat</button>
          <button class="btn wood danger" id="btnTrash">🗑️</button>
          <button class="btn primary" id="btnServe">🛎️ Teslim Et</button>
        </div>
      </div>
    </section>

    <!-- YÜKSELTMELER -->
    <section id="tab-upgrades" class="tab">
      <h2 class="ribbon">🛠️ Geliştir</h2>
      <p class="muted">Kazandığın parayla dükkanını büyüt.</p>
      <div id="upgradeList" class="list"></div>
    </section>

    <!-- MAĞAZA -->
    <section id="tab-shop" class="tab">
      <h2 class="ribbon">⭐ Mağaza</h2>
      <p class="muted">Telegram Stars ile kalıcı güçlendirmeler.</p>
      <div id="shopList" class="list"></div>
    </section>

    <!-- ÖDÜLLER -->
    <section id="tab-rewards" class="tab">
      <h2 class="ribbon">🏆 Ödüller</h2>
      <p class="muted">Ne kadar döner sararsan o kadar yıldız! 🥙 = ⭐</p>
      <div id="rewardsBox" class="list"></div>
      <div class="card">
        <p>Toplam satış: <b id="statServed">0</b> · Toplam kazanç: <b id="statEarned">0</b> 💰</p>
      </div>
    </section>
  </main>

  <nav class="tabs">
    <button data-tab="game" class="active"><i>🏪</i><span>Dükkan</span></button>
    <button data-tab="upgrades"><i>🛠️</i><span>Geliştir</span></button>
    <button data-tab="shop"><i>🛍️</i><span>Mağaza</span></button>
    <button data-tab="rewards"><i>🏆</i><span>Ödüller</span></button>
  </nav>

  <div id="toast" class="toast"></div>
  <div id="modal" class="modal hidden"><div class="card"><p id="modalText"></p><button class="btn primary" id="modalOk">Tamam</button></div></div>
  <div id="settings" class="modal hidden">
    <div class="card">
      <h2 class="ribbon small-ribbon">⚙️ Ayarlar</h2>
      <button class="btn wood" id="tgMusic">🎵 Müzik: Açık</button>
      <button class="btn wood" id="tgSfx">🔊 Efektler: Açık</button>
      <button class="btn primary" id="settingsOk">Kapat</button>
    </div>
  </div>

  <script src="static/audio.js"></script>
  <script src="static/food.js"></script>
  <script src="static/doner3d.js"></script>
  <script src="static/game.js"></script>
</body>
</html>
